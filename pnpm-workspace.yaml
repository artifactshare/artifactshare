saveExact: true

packages:
  - 'apps/*'
  - 'packages/*'
  - '!packages/npm-reserved'
  - 'tools/*'

overrides:
  # The previous Rolldown 1.2.15 graph failed Vite sourcemapPathTransform.
  # Keep matching JS/native bindings; remove after an upgrade passes the D1 suite.
  'vite@8.3.3>rolldown': 1.2.14
  'lodash-es@>=4.0.0 <5.0.0': 4.18.1
  'undici@>=7.0.0 <8.0.0': 7.29.1
  'postcss@>=8.0.0 <9.0.0': 8.5.28
  'miniflare>sharp@>=0.34.0 <0.35.5': 0.35.5

allowBuilds:
  esbuild: true
  lefthook: true
  msw: true
  protobufjs: false
  sharp: true
  workerd: true

# Only exceptions for versions still resolved in the lockfile are retained.
minimumReleaseAgeExclude:
  - miniflare@5.20260911.0-alpha
  - wrangler@4.131.1
  - '@cloudflare/vite-plugin@1.54.8'
  - '@tanstack/highlight@0.1.0'
  - '@tanstack/markdown@0.0.14'
  - happy-dom@20.14.5
  - yaml@2.9.1
