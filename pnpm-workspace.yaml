saveExact: true

packages:
  - 'apps/*'
  - 'packages/*'
  - '!packages/npm-reserved'
  - 'tools/*'

overrides:
  # Keep transitive tooling dependencies on the patched minimatch major.
  'minimatch@>=10.0.0 <11.0.0': 11.0.8
  'vite-plus@<1.1.0': 1.7.0
  '@vitest/mocker@4.1.11': 4.1.12
  # Keep Vite within its ~1.2.18 Rolldown range; 1.3 produces invalid imports.
  # Rolldown 1.2.15 previously failed Vite sourcemapPathTransform.
  'vite@8.3.8>rolldown': 1.2.19
  'lodash-es@>=4.0.0 <5.0.0': 4.18.1
  'undici@>=7.0.0 <8.0.0': 7.30.2
  'postcss@>=8.0.0 <9.0.0': 8.5.32
  'miniflare>sharp@>=0.34.0 <0.35.5': 0.35.5

allowBuilds:
  esbuild: true
  lefthook: true
  msw: true
  protobufjs: false
  sharp: true
  workerd: true

# Explicitly requested current releases that pass the install supply-chain checks.
# Keep exceptions exact and remove versions no longer resolved in the lockfile.
minimumReleaseAgeExclude:
  - 'yaml@2.9.1'
  - 'better-call@1.4.5'
  - 'kysely@0.29.9'
