\* The scope the check runs in. check.mjs reads CONSTANTS and INVARIANTS from
\* this file and runs TLC once per invariant.
CONSTANTS
    Workers = {w1, w2}
    Requests = {r1, r2}
    MaxRefreshes = 2
    MaxCred = 4
    MaxSess = 5
    LogoutEnabled = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoFork
    RotationRepliesAreLive
    RepliesMatchTheirRotation
    LogoutIsFinal
    SignOutAllIsFinal
    SignOutAllEndsEveryCliSession
