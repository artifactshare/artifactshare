x-visual: &visual
  image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
  platform: linux/amd64
  ipc: host
  working_dir: /workspace
  entrypoint: ['bash', '-lc']
  environment:
    CI: 'true'
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    VISUAL_FAULT: ${VISUAL_FAULT:-}
    VITEST_TEST_NAME: ${VITEST_TEST_NAME:-}
  volumes:
    - type: bind
      source: .
      target: /workspace
    - type: volume
      source: playwright-pnpm-store
      target: /pnpm/store
    - type: volume
      source: playwright-root-node-modules
      target: /workspace/node_modules
    - type: volume
      source: playwright-web-node-modules
      target: /workspace/apps/web/node_modules
    - type: volume
      source: playwright-cli-node-modules
      target: /workspace/packages/cli/node_modules
    - type: volume
      source: playwright-fixtures-node-modules
      target: /workspace/tools/static-site-fixtures/node_modules

services:
  visual:
    <<: *visual
    command:
      - >-
        npm install --global node@24.21.0 pnpm@12.4.1 &&
        pnpm config set store-dir /pnpm/store &&
        pnpm install --frozen-lockfile --ignore-scripts &&
        pnpm --filter @artifactshare/web exec vitest --config vitest.visual.browser.config.ts --run $${VITEST_TEST_NAME:+--testNamePattern "$${VITEST_TEST_NAME}"}

  visual-update:
    <<: *visual
    command:
      - >-
        npm install --global node@24.21.0 pnpm@12.4.1 &&
        pnpm config set store-dir /pnpm/store &&
        pnpm install --frozen-lockfile --ignore-scripts &&
        pnpm --filter @artifactshare/web exec vitest --config vitest.visual.browser.config.ts --run --update

volumes:
  playwright-pnpm-store:
  playwright-root-node-modules:
  playwright-web-node-modules:
  playwright-cli-node-modules:
  playwright-fixtures-node-modules:
