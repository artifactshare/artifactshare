name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'
  # Manual run from main, for releasing where a tag cannot be pushed (for
  # example a cloud agent session). The workflow tags main after publishing.
  workflow_dispatch:
    inputs:
      version:
        description: Exact unpublished CLI version to release from current main
        required: true
        type: string

permissions: {}

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  pack:
    name: Build release tarball
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Require the current validated public main commit
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF_NAME" = "main"
          fi
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:cli-release
      - name: Verify tag version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_VERSION="$RELEASE_VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/cli-v$TAG_VERSION" >/dev/null; then
              echo "cli-v$TAG_VERSION already exists" >&2
              exit 1
            fi
          fi
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          test "$TAG_VERSION" = "$PKG_VERSION"
      - name: Require an unpublished npm version
        run: |
          PKG_NAME=$(node -p "require('./packages/cli/package.json').name")
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VERSION is already published" >&2
            exit 1
          fi
      - run: pnpm --filter @artifactshare/cli typecheck
      - run: pnpm --filter @artifactshare/cli test
      - run: pnpm --filter @artifactshare/cli test:package
      - run: pnpm check:cli-changelog
      - run: pnpm check:cli-reference
      - name: Pack the tarball and refuse unresolved workspace ranges
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          TGZ=$(pnpm --filter @artifactshare/cli pack --pack-destination "$RUNNER_TEMP/release" | tail -1)
          tar -xzOf "$TGZ" package/package.json |
            node -e '
              const manifest = JSON.parse(
                require("node:fs").readFileSync(0, "utf8"),
              )
              const left = [
                "dependencies",
                "devDependencies",
                "optionalDependencies",
                "peerDependencies",
              ]
                .flatMap((field) => Object.entries(manifest[field] ?? {}))
                .filter(([, range]) => String(range).startsWith("workspace:"))
              if (left.length > 0) {
                console.error("workspace ranges in the tarball: " + JSON.stringify(left))
                process.exit(1)
              }
            '
          cd "$RUNNER_TEMP/release"
          sha256sum "$(basename "$TGZ")" > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-release
          path: |
            ${{ runner.temp }}/release/*.tgz
            ${{ runner.temp }}/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish approved tarball
    needs: pack
    environment: production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-release
          path: ${{ runner.temp }}/release
      - name: Verify and publish exact tarball
        working-directory: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          mapfile -t tarballs < <(find . -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          pnpm publish "${tarballs[0]}" --no-git-checks --access public --provenance

  tag:
    name: Tag the released commit
    if: github.event_name == 'workflow_dispatch'
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create cli-v tag on the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/cli-v$RELEASE_VERSION" \
            -f sha="$GITHUB_SHA"
