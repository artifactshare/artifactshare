name: Deploy production
run-name: Production ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'deploy' }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact validated main SHA approved for this manual run
        required: true
        type: string
      mode:
        description: Build, deploy, or temporary OAuth scope migration operation
        required: true
        default: shadow
        type: choice
        options:
          - shadow
          - deploy
          - oauth-scope-plan
          - oauth-scope-apply
      oauth_scope_planning_cutoff:
        description: Exact UTC cutoff emitted by the approved OAuth scope plan
        required: false
        type: string
      oauth_scope_expected_digest:
        description: SHA-256 digest emitted by the approved OAuth scope plan
        required: false
        type: string
      oauth_scope_allow_shared_client_impact:
        description: Apply the reviewed shared-client impact from the plan
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  shadow:
    name: Validate production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Bind a manual run to the explicitly approved SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - name: Verify the exact merge-queue validated SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-validated-sha.mjs "${{ github.sha }}"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the production topology without writing to Cloudflare
        run: |
          pnpm --filter @artifactshare/web build:production
          pnpm --filter @artifactshare/web build:alerts:production
          pnpm --filter @artifactshare/web build:og-image:production
          pnpm --filter @artifactshare/web build:sandbox:production
      - name: Summarize validation
        run: |
          {
            echo '### Production build validated'
            echo
            echo "- Revision: \`$GITHUB_SHA\`"
            echo '- Merge-queue validation: confirmed'
            echo '- Topology built without production writes: app, alerts, OG image, sandbox'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy and verify production
    if: github.event_name == 'push' || inputs.mode == 'deploy'
    needs: shadow
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://artifactshare.com
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Deploy the validated production topology
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @artifactshare/web deploy:production
      - name: Smoke test production
        run: node scripts/verify-production-origin.mjs --retries 2 --retry-delay-ms 15000
      - name: Summarize deployment
        run: |
          {
            echo '### Production deployment verified'
            echo
            echo "- Revision: \`$GITHUB_SHA\`"
            echo '- Environment: [production](https://artifactshare.com)'
            echo '- Topology deployed: app, alerts, OG image, sandbox'
            echo '- Production origin smoke test: passed'
          } >> "$GITHUB_STEP_SUMMARY"

  oauth-scope-migration:
    # Remove this temporary job after full migration and the enforcement
    # release's access-token lifetime plus clock-tolerance waiting window.
    name: OAuth scope migration ${{ inputs.mode == 'oauth-scope-plan' && 'plan' || 'apply' }}
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'oauth-scope-plan' || inputs.mode == 'oauth-scope-apply')
    needs: shadow
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Run protected OAuth scope migration operation
        env:
          OAUTH_SCOPE_MIGRATION_MODE: ${{ inputs.mode == 'oauth-scope-plan' && 'plan' || 'apply' }}
          OAUTH_SCOPE_MIGRATION_PLANNING_CUTOFF: ${{ inputs.oauth_scope_planning_cutoff }}
          OAUTH_SCOPE_MIGRATION_EXPECTED_DIGEST: ${{ inputs.oauth_scope_expected_digest }}
          OAUTH_SCOPE_MIGRATION_ALLOW_SHARED_CLIENT_IMPACT: ${{ inputs.oauth_scope_allow_shared_client_impact }}
          OAUTH_SCOPE_MIGRATION_TARGETS: ${{ secrets.OAUTH_SCOPE_MIGRATION_TARGETS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/oauth-scope-pilot-migration.mjs
