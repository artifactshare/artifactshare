name: Deploy production
run-name: Production ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'deploy' }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact validated main SHA approved for this manual run
        required: true
        type: string
      mode:
        description: Build-only shadow or protected production deployment
        required: true
        default: shadow
        type: choice
        options:
          - shadow
          - deploy

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  shadow:
    name: Validate production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Bind a manual run to the explicitly approved SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - name: Verify the exact merge-queue validated SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-validated-sha.mjs "${{ github.sha }}"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the production topology without writing to Cloudflare
        run: |
          pnpm --filter @artifactshare/web build:production
          pnpm --filter @artifactshare/web build:alerts:production
          pnpm --filter @artifactshare/web build:og-image:production
          pnpm --filter @artifactshare/web build:sandbox:production
      - name: Summarize validation
        run: |
          {
            echo '### Production build validated'
            echo
            echo "- Revision: \`$GITHUB_SHA\`"
            echo '- Merge-queue validation: confirmed'
            echo '- Topology built without production writes: app, alerts, OG image, sandbox'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy and verify production
    if: github.event_name == 'push' || inputs.mode == 'deploy'
    needs: shadow
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://artifactshare.com
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Deploy the validated production topology
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @artifactshare/web deploy:production
      - name: Smoke test production
        run: node scripts/verify-production-origin.mjs --retries 2 --retry-delay-ms 15000
      - name: Summarize deployment
        run: |
          {
            echo '### Production deployment verified'
            echo
            echo "- Revision: \`$GITHUB_SHA\`"
            echo '- Environment: [production](https://artifactshare.com)'
            echo '- Topology deployed: app, alerts, OG image, sandbox'
            echo '- Production origin smoke test: passed'
          } >> "$GITHUB_STEP_SUMMARY"
