name: Flaky detector

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Whole-suite repetitions (integer 1–50)
        type: string
        required: true
        default: '20'
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

# Preserve an in-progress detector; a newer pending run replaces an older
# pending run. Serializing entire runs keeps the worker cap global here.
concurrency:
  group: flaky-detector
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      repetitions: ${{ steps.plan.outputs.repetitions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - id: plan
        env:
          REPETITIONS: ${{ github.event_name == 'schedule' && '20' || inputs.repetitions }}
        run: node scripts/ci/flaky-runs.mjs plan

  worker:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - if: matrix.suite == 'scripts' || matrix.suite == 'web-unit'
        run: pnpm fixtures:build
      - if: matrix.suite == 'behavior-browser' || matrix.suite == 'web-unit'
        run: pnpm --filter @artifactshare/contract build
      - if: matrix.suite == 'behavior-browser'
        run: pnpm --filter @artifactshare/web exec playwright install --with-deps ${{ matrix.project }}
      - id: browser-cache-image
        if: ${{ matrix.suite == 'behavior-browser' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.repository.default_branch != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
        continue-on-error: true
        shell: bash
        run: |
          : "${ImageOS:?runner ImageOS is required for caching}"
          printf 'ImageOS=%s\n' "$ImageOS" >> "$GITHUB_ENV"
      - id: browser-cache-stage
        if: ${{ matrix.suite == 'behavior-browser' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.repository.default_branch != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && steps.browser-cache-image.outcome == 'success' && env.ImageOS != '' }}
        continue-on-error: true
        run: bash scripts/ci/browser-system-packages.sh /var/cache/apt/archives "$RUNNER_TEMP/browser-system-packages"
      - id: browser-cache-save
        if: ${{ matrix.suite == 'behavior-browser' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.repository.default_branch != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && steps.browser-cache-image.outcome == 'success' && env.ImageOS != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/browser-system-packages
          key: browser-system-packages-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ matrix.project }}-${{ github.run_id }}
      - name: Repeat the whole suite
        env:
          SHARD: ${{ toJSON(matrix) }}
          REPETITIONS: ${{ needs.plan.outputs.repetitions }}
          RESULTS_DIR: ${{ runner.temp }}/flaky-results
        run: node scripts/ci/flaky-runs.mjs run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: flaky-results-${{ matrix.id }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/flaky-results
          if-no-files-found: warn

  report:
    needs: [plan, worker]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: flaky-results-*
          merge-multiple: true
          path: ${{ runner.temp }}/flaky-results
      - name: Aggregate all expected repetitions
        env:
          REPETITIONS: ${{ needs.plan.outputs.repetitions }}
        run: node scripts/ci/flaky-report.mjs "$RUNNER_TEMP/flaky-results" "$REPETITIONS" "$GITHUB_SHA" "$RUNNER_TEMP/flaky-report.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: flaky-report
          path: ${{ runner.temp }}/flaky-report.json
          if-no-files-found: error
