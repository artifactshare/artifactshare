name: Flaky detector

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Whole-suite repetitions (integer 1–50)
        type: string
        required: true
        default: '20'
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

# Preserve an in-progress detector; a newer pending run replaces an older
# pending run. Serializing entire runs keeps the worker cap global here.
concurrency:
  group: flaky-detector
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      repetitions: ${{ steps.plan.outputs.repetitions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - id: plan
        env:
          REPETITIONS: ${{ github.event_name == 'schedule' && '20' || inputs.repetitions }}
        run: node scripts/ci/flaky-runs.mjs plan

  worker:
    needs: plan
    runs-on: ubuntu-latest
    # The runner treats an empty object.image as no job container, keeping
    # non-browser suites on the host under the same global worker cap.
    container:
      image: ${{ matrix.suite == 'behavior-browser' && 'mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f' || '' }}
      options: --init --ipc=host
      env:
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set browser container home
        if: matrix.suite == 'behavior-browser'
        # Use one root-owned home for setup, Firefox and persistent Git trust.
        run: |
          export HOME=/root
          echo 'HOME=/root' >> "$GITHUB_ENV"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - if: matrix.suite == 'scripts' || matrix.suite == 'web-unit'
        run: pnpm fixtures:build
      - if: matrix.suite == 'behavior-browser' || matrix.suite == 'web-unit'
        run: pnpm --filter @artifactshare/contract build
      - name: Repeat the whole suite
        env:
          SHARD: ${{ toJSON(matrix) }}
          REPETITIONS: ${{ needs.plan.outputs.repetitions }}
          RESULTS_DIR: ${{ runner.temp }}/flaky-results
        run: node scripts/ci/flaky-runs.mjs run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: flaky-results-${{ matrix.id }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/flaky-results
          if-no-files-found: warn

  report:
    needs: [plan, worker]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: flaky-results-*
          merge-multiple: true
          path: ${{ runner.temp }}/flaky-results
      - name: Aggregate all expected repetitions
        env:
          REPETITIONS: ${{ needs.plan.outputs.repetitions }}
        run: node scripts/ci/flaky-report.mjs "$RUNNER_TEMP/flaky-results" "$REPETITIONS" "$GITHUB_SHA" "$RUNNER_TEMP/flaky-report.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: flaky-report
          path: ${{ runner.temp }}/flaky-report.json
          if-no-files-found: error
