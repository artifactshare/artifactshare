name: Public CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          fetch-tags: false
          path: trusted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: false
          path: head
      - name: Guard pull request boundary
        env:
          PUBLIC_PR_TITLE: ${{ github.event.pull_request.title }}
          PUBLIC_PR_BODY: ${{ github.event.pull_request.body }}
          PUBLIC_PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUBLIC_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUBLIC_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PUBLIC_PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          node -e "const fs=require('node:fs'); fs.writeFileSync(process.env.RUNNER_TEMP + '/public-pr-title.txt', process.env.PUBLIC_PR_TITLE ?? ''); fs.writeFileSync(process.env.RUNNER_TEMP + '/public-pr-body.txt', process.env.PUBLIC_PR_BODY ?? '')"
          git -C "$GITHUB_WORKSPACE/head" fetch --no-tags "$GITHUB_WORKSPACE/trusted" "$PUBLIC_PR_BASE"
          node trusted/scripts/public-development-guard.mjs --ci-pr --repo "$GITHUB_WORKSPACE/head" --manifest-repo "$GITHUB_WORKSPACE/trusted" --base "$PUBLIC_PR_BASE" --head "$PUBLIC_PR_HEAD" --head-repo-full-name "$PUBLIC_PR_HEAD_REPO" --base-repo-full-name "$PUBLIC_PR_BASE_REPO" --metadata-file "$RUNNER_TEMP/public-pr-title.txt" --metadata-file "$RUNNER_TEMP/public-pr-body.txt"

  static-validation:
    name: Public static and unit validation
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm fixtures:build
      - run: pnpm validate:static

  build-validation:
    name: Public build and integration validation
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm db:apply:local
      - name: Verify isolated local D1 recovery
        run: pnpm check:dev-setup
      - run: pnpm validate:build

  cli-validation:
    name: Public CLI validation
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm validate:cli

  browser-validation:
    name: Public browser and local-state validation
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @artifactshare/web exec playwright install --with-deps chrome
      - run: pnpm test:behavior-browser
      - name: Verify scenario routes and in-app navigation
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: pnpm check:browser-local-state

  visual-validation:
    name: Public Linux visual validation
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
      - run: docker compose -f compose.playwright.yml run --rm visual

  validate:
    name: Public full validation
    if: ${{ always() && github.event_name == 'merge_group' }}
    needs:
      [
        static-validation,
        build-validation,
        cli-validation,
        browser-validation,
        visual-validation,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation lane to pass
        env:
          STATIC_RESULT: ${{ needs.static-validation.result }}
          BUILD_RESULT: ${{ needs.build-validation.result }}
          CLI_RESULT: ${{ needs.cli-validation.result }}
          BROWSER_RESULT: ${{ needs.browser-validation.result }}
          VISUAL_RESULT: ${{ needs.visual-validation.result }}
        run: test "$STATIC_RESULT" = success && test "$BUILD_RESULT" = success && test "$CLI_RESULT" = success && test "$BROWSER_RESULT" = success && test "$VISUAL_RESULT" = success
