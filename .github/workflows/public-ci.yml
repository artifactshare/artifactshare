name: Public CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Classify pull request
        id: classify
        env:
          PUBLIC_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PUBLIC_PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          node -e "const fs=require('node:fs'); const headRepoFullName=process.env.PUBLIC_PR_HEAD_REPO ?? ''; const baseRepoFullName=process.env.PUBLIC_PR_BASE_REPO ?? ''; const isMaintainer=headRepoFullName !== '' && headRepoFullName === baseRepoFullName; fs.appendFileSync(process.env.GITHUB_OUTPUT, 'is_maintainer=' + isMaintainer + '\n')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch tip, not the fork-point sha: the guard script and
          # its scan policy merged to main take effect for open PRs without
          # advancing their fork point, and the PR author cannot influence
          # either ref. The diff base below still uses the fork-point sha, and
          # the guard reads the baseline boundary manifest from that commit so
          # it always describes the tree it classifies.
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          fetch-tags: false
          path: trusted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: false
          path: head
      - name: ${{ steps.classify.outputs.is_maintainer == 'true' && 'Check maintainer pull request boundary' || 'Check proposal-only boundary' }}
        id: boundary
        env:
          PUBLIC_PR_TITLE: ${{ github.event.pull_request.title }}
          PUBLIC_PR_BODY: ${{ github.event.pull_request.body }}
          PUBLIC_PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUBLIC_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUBLIC_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PUBLIC_PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          set -euo pipefail
          node -e "const fs=require('node:fs'); fs.writeFileSync(process.env.RUNNER_TEMP + '/public-pr-title.txt', process.env.PUBLIC_PR_TITLE ?? ''); fs.writeFileSync(process.env.RUNNER_TEMP + '/public-pr-body.txt', process.env.PUBLIC_PR_BODY ?? '')"
          PUBLIC_TRUSTED_HEAD="$(git -C "$GITHUB_WORKSPACE/trusted" rev-parse HEAD)"
          git -C "$GITHUB_WORKSPACE/head" fetch --no-tags "$GITHUB_WORKSPACE/trusted" "$PUBLIC_PR_BASE" "$PUBLIC_TRUSTED_HEAD"
          node trusted/scripts/public-development-guard.mjs --ci-pr --repo "$GITHUB_WORKSPACE/head" --manifest-repo "$GITHUB_WORKSPACE/trusted" --base "$PUBLIC_PR_BASE" --head "$PUBLIC_PR_HEAD" --trusted-head "$PUBLIC_TRUSTED_HEAD" --head-repo-full-name "$PUBLIC_PR_HEAD_REPO" --base-repo-full-name "$PUBLIC_PR_BASE_REPO" --metadata-file "$RUNNER_TEMP/public-pr-title.txt" --metadata-file "$RUNNER_TEMP/public-pr-body.txt"
      - name: Summarize pull request boundary
        id: summary
        if: ${{ !cancelled() }}
        env:
          IS_MAINTAINER: ${{ steps.classify.outputs.is_maintainer }}
          BOUNDARY_OUTCOME: ${{ steps.boundary.outcome }}
        run: |
          set -euo pipefail
          if [ "$IS_MAINTAINER" = "true" ]; then
            if [ "$BOUNDARY_OUTCOME" = "success" ]; then
              {
                echo '## Maintainer pull request boundary'
                echo
                echo 'The public repository boundary passed.'
                echo
                echo 'The pull request is ready for maintainer review.'
              } >> "$GITHUB_STEP_SUMMARY"
            elif [ "$BOUNDARY_OUTCOME" = "failure" ]; then
              {
                echo '## Maintainer pull request boundary'
                echo
                echo 'The public repository boundary did not pass.'
                echo
                echo 'Review the diagnostic in the failed boundary step.'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo '## Maintainer pull request boundary'
                echo
                echo 'The public repository boundary check did not complete.'
                echo
                echo 'Review the workflow run before continuing.'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            if [ "$BOUNDARY_OUTCOME" = "success" ]; then
              {
                echo '## Proposal check'
                echo
                echo 'The proposal-only boundary passed.'
                echo
                echo 'No action is required from the contributor. The proposal is ready for maintainer review.'
                echo
                echo 'Full repository validation runs later in the merge queue.'
              } >> "$GITHUB_STEP_SUMMARY"
            elif [ "$BOUNDARY_OUTCOME" = "failure" ]; then
              {
                echo '## Proposal check'
                echo
                echo 'The proposal check did not pass.'
                echo
                echo 'Review the failed boundary step for details.'
                echo
                echo 'Common requirements to check: an external pull request must add exactly one new .md or .txt file directly in proposals/ (not in a subdirectory) and make no other changes.'
                echo
                echo 'The proposal content, pull request title and body, and commit messages must follow the public-content rules in proposals/README.md.'
                echo
                echo 'If the diagnostic identifies a proposal requirement, push a correction to this pull request. Otherwise, no contributor action is required unless a maintainer requests one.'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo '## Proposal check'
                echo
                echo 'The proposal check did not complete.'
                echo
                echo 'No contributor action is required unless a maintainer requests a change.'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  static-validation:
    name: Public static and unit validation
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm validate:static

  build-validation:
    name: Public build and integration validation
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm db:apply:local
      - name: Verify isolated local D1 recovery
        run: pnpm check:dev-setup
      - run: pnpm validate:build

  cli-validation:
    name: Public CLI validation
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm validate:cli

  windows-cli-validation:
    name: Windows CLI credential validation
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @artifactshare/cli exec vitest run src/token-store.test.ts
        env:
          ARTIFACTSHARE_WINDOWS_CREDENTIAL_INTEGRATION: '1'

  browser-validation:
    name: Public browser and local-state validation
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @artifactshare/web exec playwright install --with-deps chromium
      - run: pnpm test:behavior-browser
      - name: Verify scenario routes and in-app navigation
        run: pnpm check:browser-local-state

  visual-validation:
    name: Public Linux visual validation
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
      - run: docker compose -f compose.playwright.yml run --rm visual

  validate:
    name: Public full validation
    if: ${{ always() && github.event_name == 'merge_group' }}
    needs:
      [
        static-validation,
        build-validation,
        cli-validation,
        windows-cli-validation,
        browser-validation,
        visual-validation,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation lane to pass
        env:
          STATIC_RESULT: ${{ needs.static-validation.result }}
          BUILD_RESULT: ${{ needs.build-validation.result }}
          CLI_RESULT: ${{ needs.cli-validation.result }}
          WINDOWS_CLI_RESULT: ${{ needs.windows-cli-validation.result }}
          BROWSER_RESULT: ${{ needs.browser-validation.result }}
          VISUAL_RESULT: ${{ needs.visual-validation.result }}
        run: test "$STATIC_RESULT" = success && test "$BUILD_RESULT" = success && test "$CLI_RESULT" = success && test "$WINDOWS_CLI_RESULT" = success && test "$BROWSER_RESULT" = success && test "$VISUAL_RESULT" = success
